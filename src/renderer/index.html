<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' media: jf: data: https://*.steamstatic.com; media-src 'self' jf: blob:; connect-src 'self' jf:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>Halcyon</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/dashboard.css">
  <link rel="stylesheet" href="styles/overlays.css">
  <link rel="stylesheet" href="styles/themes.css">
</head>
<body data-accent="emerald" data-input="keys">
  <div id="bg">
    <div class="bg__aurora"></div>
    <div class="bg__img" id="bgA"></div>
    <div class="bg__img" id="bgB"></div>
    <div class="bg__shade"></div>
  </div>

  <div id="app">
    <header id="top">
      <div class="orb" id="orb" title="Guide"><i></i></div>
      <span class="glyph glyph--lb bumper" id="lbGlyph">LB</span>
      <nav id="tabs" data-focus-group data-focus-restore></nav>
      <span class="glyph glyph--rb bumper" id="rbGlyph">RB</span>
      <div class="status">
        <div id="pads"></div>
        <div class="status__time"><div id="clock"></div><div id="date"></div></div>
      </div>
    </header>
    <main id="stage"></main>
    <footer id="bottom"><div id="context"></div></footer>
  </div>

  <div id="layers"></div>
  <div id="hints"></div>
  <div id="toasts"></div>
  <div id="saver"><div class="saver__card"><div id="saverClock"></div><div id="saverDate"></div></div></div>
  <div id="boot">
    <div class="boot__mark">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="boot__track" cx="50" cy="50" r="44"/><circle class="boot__ring" cx="50" cy="50" r="44"/></svg>
      <div class="boot__core"></div>
    </div>
    <div class="boot__word">HALCYON</div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
